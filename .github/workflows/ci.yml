name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --features testutils

      - name: Install stellar-cli
        # GitHub-hosted runners don't ship `stellar`; install the pinned CLI.
        # stellar-cli's dependency tree pulls libdbus-sys, which needs the
        # dbus system library present at build time.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev
          cargo install --locked stellar-cli --version 27.1.0

      - name: Build registry contract (wasm)
        run: cd contracts/registry && stellar contract build

      - name: Build extender contract (wasm)
        run: cd contracts/extender && stellar contract build
